</head> <script>
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
let W = cvs.width = window.innerWidth, H = cvs.height = window.innerHeight;
window.addEventListener('resize', () => { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; });

let ctrl = 'touch', mode = 'offline', running = false, audioCtx;
let hp = 100, maxHp = 100, cash = 0, xp = 0, lvl = 1, hasLoot = false;
let punchPow = 1.4, fireCd = 0, fireRate = 12, isDead = false;
let player = { x: 0, z: 42, y: 0, yaw: 0, vx: 0, vz: 0, vy: 0, fallen: 0 };
let spawnPt = { x: 0, z: 42 };
let moveF = 0, moveR = 0, animPunch = 0, animSweep = 0, inVeh = null;

const buildings = [], vehicles = [], bullets = [], particles = [], bots = [], peers = {};
const checkpoints = [{ x: 42, z: 0 }, { x: -42, z: 0 }, { x: 0, z: 42 }, { x: 0, z: -42 }];

function playSfx(t) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), now = audioCtx.currentTime;
    o.connect(g); g.connect(audioCtx.destination);
    if (t === 'shoot') { o.type = 'sawtooth'; o.frequency.setValueAtTime(600, now); o.frequency.exponentialRampToValueAtTime(120, now + 0.12); g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.12); o.start(now); o.stop(now + 0.12); }
    else if (t === 'boom') { o.type = 'square'; o.frequency.setValueAtTime(110, now); o.frequency.exponentialRampToValueAtTime(25, now + 0.4); g.gain.setValueAtTime(0.28, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.4); o.start(now); o.stop(now + 0.4); }
    else if (t === 'punch') { o.type = 'triangle'; o.frequency.setValueAtTime(190, now); o.frequency.exponentialRampToValueAtTime(40, now + 0.18); g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.18); o.start(now); o.stop(now + 0.18); }
    else if (t === 'cash') { o.type = 'sine'; o.frequency.setValueAtTime(520, now); o.frequency.setValueAtTime(780, now + 0.1); g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.25); o.start(now); o.stop(now + 0.25); }
  } catch (e) {}
}

function pickCtrl(c) {
  ctrl = c;
  document.getElementById('m-touch').className = c === 'touch' ? 'sel' : '';
  document.getElementById('m-pc').className = c === 'pc' ? 'alt sel' : 'alt';
}

function initWorld() {
  for (let x = -60; x <= 60; x += 40) {
    for (let z = -60; z <= 60; z += 40) {
      if (x === 0 && z === 0) continue;
      buildings.push({ x, z, w: 20, d: 20, h: 24 + Math.abs((x * 3 + z * 5) % 26), col: (x + z) % 80 === 0 ? '#1b263b' : '#16213e', win: '#00f2fe' });
    }
  }
  // Banque Centrale (0,0)
  buildings.push({ x: 0, z: 0, w: 18, d: 18, h: 18, col: '#3a2a06', win: '#ffd700' });

  // 4 Voitures de sport + 2 Tanks blindés
  [[15, 22, '#00f2fe', 'car'], [-15, -22, '#ff0055', 'car'], [40, -18, '#ffd700', 'car'], [-40, 18, '#00ff88', 'car'], [25, -40, '#4a7c36', 'tank'], [-25, 40, '#4a7c36', 'tank']].forEach(([vx, vz, col, type]) => {
    vehicles.push({ x: vx, z: vz, yaw: 0, speed: 0, col, type, driver: null });
  });

  // 8 Bots IA (Policiers & Gangsters)
  [[12, 12], [-12, 12], [-20, 0], [20, 0], [-35, -35], [35, -35], [-35, 35], [35, 35]].forEach(([bx, bz], i) => {
    bots.push({ x: bx, z: bz, y: 0, vx: 0, vz: 0, vy: 0, hp: 100, fallen: 0, dead: 0, cd: 60 + i * 15, col: i < 4 ? '#2563eb' : '#dc2626' });
  });
}

function initOnline() {
  if (mode !== 'online') { document.getElementById('net-info').innerText = '🤖 Solo + 8 Bots IA'; return; }
  document.getElementById('net-info').innerText = '🟡 Recherche joueurs P2P...';
  try {
    const ws = new WebSocket('wss://://socketsbay.com');
    const myId = 'P-' + Math.floor(1000 + Math.random() * 9000);
    ws.onopen = () => {
      document.getElementById('net-info').innerText = '🟢 En Ligne (' + myId + ')';
      setInterval(() => {
        if (ws.readyState === 1) ws.send(JSON.stringify({ app: 'CYBER_EMPIRE_SKD', id: myId, x: player.x, z: player.z, y: player.y, yaw: player.yaw, fallen: player.fallen > 0 || isDead, loot: hasLoot }));
      }, 90);
    };
    ws.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.app !== 'CYBER_EMPIRE_SKD' || d.id === myId) return;
        if (d.type === 'hit' && d.target === myId) {
          if (d.kind === 'punch') { player.vx = d.dx; player.vz = d.dz; player.vy = 0.55; takeDamage(25); }
          else if (d.kind === 'sweep') { player.fallen = 90; takeDamage(15); }
          else takeDamage(d.tank ? 60 : 12);
        } else if (d.x !== undefined) {
          peers[d.id] = { x: d.x, z: d.z, y: d.y, yaw: d.yaw, fallen: d.fallen, loot: d.loot, ttl: 120 };
          document.getElementById('net-info').innerText = '🟢 En Ligne : ' + (Object.keys(peers).length + 1) + ' joueur(s)';
        }
      } catch (err) {}
    };
    ws.onerror = () => { document.getElementById('net-info').innerText = '🤖 Hors-Ligne (Bots actifs)'; };
    window.sendNet = (obj) => { if (ws.readyState === 1) ws.send(JSON.stringify({ app: 'CYBER_EMPIRE_SKD', id: myId, ...obj })); };
  } catch (e) { document.getElementById('net-info').innerText = '🤖 Hors-Ligne (Bots actifs)'; }
}
</script> <script>
function toggleShop() {
  const m = document.getElementById('shop-modal');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}
function buyItem(it, price) {
  if (cash < price) { alert('Pas assez d’argent ! Braque la banque ou élimine des bots.'); return; }
  cash -= price; playSfx('cash'); document.getElementById('cash').innerText = cash;
  if (it === 'heal') hp = maxHp;
  else if (it === 'armor') { maxHp += 50; hp = maxHp; document.getElementById('maxhp').innerText = maxHp; }
  else if (it === 'punch') punchPow = 2.6;
  else if (it === 'rapid') fireRate = 5;
  document.getElementById('hp').innerText = hp; toggleShop();
}
function addReward(m, gXp) {
  cash += m; xp += gXp; playSfx('cash');
  if (xp >= lvl * 100) { lvl++; maxHp += 20; hp = maxHp; document.getElementById('lvl').innerText = lvl; document.getElementById('maxhp').innerText = maxHp; document.getElementById('hp').innerText = hp; }
  document.getElementById('cash').innerText = cash;
}
function takeDamage(d) {
  if (isDead) return;
  hp = Math.max(0, hp - d); document.getElementById('hp').innerText = hp;
  if (hp <= 0) {
    isDead = true; hasLoot = false; inVeh = null;
    document.getElementById('death-screen').style.display = 'flex';
    let s = 3; document.getElementById('respawn-txt').innerText = `Réapparition au Checkpoint dans ${s}s...`;
    const iv = setInterval(() => {
      if (--s > 0) document.getElementById('respawn-txt').innerText = `Réapparition au Checkpoint dans ${s}s...`;
      else { clearInterval(iv); isDead = false; hp = maxHp; document.getElementById('hp').innerText = hp; document.getElementById('death-screen').style.display = 'none'; player.x = spawnPt.x; player.z = spawnPt.z; player.y = 0; }
    }, 1000);
  }
}

function doShoot() {
  if (isDead || player.fallen > 0 || fireCd > 0) return;
  fireCd = fireRate;
  const isTank = inVeh && inVeh.type === 'tank';
  if (inVeh && !isTank) return;
  playSfx(isTank ? 'boom' : 'shoot'); animPunch = 0.4;
  bullets.push({ x: player.x - Math.sin(player.yaw) * 1.5, z: player.z - Math.cos(player.yaw) * 1.5, vx: -Math.sin(player.yaw) * 2.2, vz: -Math.cos(player.yaw) * 2.2, mine: true, tank: isTank, life: 60 });
}
function doPunch() {
  if (inVeh || isDead || player.fallen > 0 || animPunch > 0) return;
  animPunch = 1.0; playSfx('punch');
  const dx = -Math.sin(player.yaw) * punchPow, dz = -Math.cos(player.yaw) * punchPow;
  bots.forEach(b => { if (b.dead <= 0 && Math.hypot(b.x - player.x, b.z - player.z) < 4.5) { b.vx = dx; b.vz = dz; b.vy = 0.55; b.hp -= 45 * punchPow; } });
  for (let id in peers) if (Math.hypot(peers[id].x - player.x, peers[id].z - player.z) < 4.5 && window.sendNet) window.sendNet({ type: 'hit', kind: 'punch', target: id, dx, dz });
}
function doSweep() {
  if (inVeh || isDead || player.fallen > 0 || animSweep > 0) return;
  animSweep = 1.0; playSfx('punch');
  bots.forEach(b => { if (b.dead <= 0 && Math.hypot(b.x - player.x, b.z - player.z) < 4.2) { b.fallen = 95; b.hp -= 30; } });
  for (let id in peers) if (Math.hypot(peers[id].x - player.x, peers[id].z - player.z) < 4.2 && window.sendNet) window.sendNet({ type: 'hit', kind: 'sweep', target: id });
}
function toggleVeh() {
  if (inVeh) { inVeh.driver = null; player.x += 2.8; inVeh = null; document.getElementById('btn-veh').innerText = '🚜 ENTRER'; return; }
  for (let v of vehicles) if (!v.driver && Math.hypot(v.x - player.x, v.z - player.z) < 5.5) { inVeh = v; v.driver = true; document.getElementById('btn-veh').innerText = '🏃 SORTIR'; break; }
}

function setupInputs() {
  if (ctrl === 'touch') {
    document.getElementById('touch-ui').style.display = 'block';
    const joy = document.getElementById('joy-zone'), stick = document.getElementById('stick');
    let jId = null, sx = 0, sy = 0;
    joy.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches.item(0); jId = t.identifier; sx = t.clientX; sy = t.clientY; }, { passive: false });
    joy.addEventListener('touchmove', (e) => { e.preventDefault(); for (let t of e.changedTouches) if (t.identifier === jId) { const dx = Math.max(-38, Math.min(38, t.clientX - sx)), dy = Math.max(-38, Math.min(38, t.clientY - sy)); stick.style.transform = `translate(${dx}px,${dy}px)`; moveR = dx / 38; moveF = -dy / 38; } }, { passive: false });
    const endJ = (e) => { for (let t of e.changedTouches) if (t.identifier === jId) { jId = null; stick.style.transform = ''; moveF = 0; moveR = 0; } };
    joy.addEventListener('touchend', endJ); joy.addEventListener('touchcancel', endJ);
    const look = document.getElementById('look-zone'); let lId = null, lx = 0;
    look.addEventListener('touchstart', (e) => { const t = e.changedTouches.item(0); lId = t.identifier; lx = t.clientX; });
    look.addEventListener('touchmove', (e) => { for (let t of e.changedTouches) if (t.identifier === lId) { player.yaw -= (t.clientX - lx) * 0.006; lx = t.clientX; } });
    look.addEventListener('touchend', (e) => { for (let t of e.changedTouches) if (t.identifier === lId) lId = null; });
    document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); doShoot(); });
    document.getElementById('btn-punch').addEventListener('touchstart', (e) => { e.preventDefault(); doPunch(); });
    document.getElementById('btn-sweep').addEventListener('touchstart', (e) => { e.preventDefault(); doSweep(); });
    document.getElementById('btn-veh').addEventListener('touchstart', (e) => { e.preventDefault(); toggleVeh(); });
  } else {
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyE') doPunch(); if (e.code === 'KeyC') doSweep(); if (e.code === 'KeyF') toggleVeh(); if (e.code === 'Space') doShoot(); upd(); });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; upd(); });
    function upd() { moveF = (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0); moveR = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft'] ? 1 : 0); }
    cvs.addEventListener('click', () => { if (document.pointerLockElement !== cvs) cvs.requestPointerLock(); else doShoot(); });
    window.addEventListener('mousemove', (e) => { if (document.pointerLockElement === cvs) player.yaw -= e.movementX * 0.003; });
  }
}

function hitWall(x, z) {
  if (Math.abs(x) > 135 || Math.abs(z) > 135) return true;
  return buildings.some(b => Math.abs(x - b.x) < b.w / 2 + 1 && Math.abs(z - b.z) < b.d / 2 + 1);
}

function project(wx, wy, wz) {
  const dx = wx - player.x, dz = wz - player.z;
  const rx = dx * Math.cos(-player.yaw) - dz * Math.sin(-player.yaw);
  const rz = -(dx * Math.sin(-player.yaw) + dz * Math.cos(-player.yaw));
  if (rz <= 0.3) return null;
  const fov = W * 0.75, camY = (isDead || player.fallen > 0) ? 0.6 : (inVeh ? 2.6 : 1.8 + player.y);
  return { sx: W / 2 + (rx * fov) / rz, sy: H / 2 - ((wy - camY) * fov) / rz, scale: fov / rz, dist: rz };
}

function render3D() {
  // Ciel & Sol Perspective
  const sky = ctx.createLinearGradient(0, 0, 0, H / 2); sky.addColorStop(0, '#040711'); sky.addColorStop(1, '#101b36');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H / 2);
  ctx.fillStyle = '#121724'; ctx.fillRect(0, H / 2, W, H / 2);

  // Zones au sol (Banque Or, Extraction Verte, Checkpoints Bleus)
  [[0, 13, 3.5, '#ffd700'], [80, 80, 5.5, '#00ff88'], ...checkpoints.map(c => [c.x, c.z, 2.5, '#00f2fe'])].forEach(([zx, zz, r, col]) => {
    const p = project(zx, 0.05, zz);
    if (p) { ctx.fillStyle = col; ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, r * p.scale, r * p.scale * 0.35, 0, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1; }
  });

  // Tri de tous les objets 3D du plus loin au plus proche (Z-Buffer)
  const items = [];
  buildings.forEach(b => items.push({ type: 'b', dist: Math.hypot(b.x - player.x, b.z - player.z), obj: b }));
  vehicles.forEach(v => { if (v !== inVeh) items.push({ type: 'v', dist: Math.hypot(v.x - player.x, v.z - player.z), obj: v }); });
  bots.forEach(b => items.push({ type: 'bot', dist: Math.hypot(b.x - player.x, b.z - player.z), obj: b }));
  for (let id in peers) items.push({ type: 'peer', dist: Math.hypot(peers[id].x - player.x, peers[id].z - player.z), obj: peers[id] });
  bullets.forEach(b => items.push({ type: 'bul', dist: Math.hypot(b.x - player.x, b.z - player.z), obj: b }));
  particles.forEach(pt => items.push({ type: 'part', dist: Math.hypot(pt.x - player.x, pt.z - player.z), obj: pt }));
  items.sort((a, b) => b.dist - a.dist);

  items.forEach(({ type, obj }) => {
    if (type === 'b') {
      const p = project(obj.x, 0, obj.z); if (!p) return;
      const w = obj.w * p.scale, h = obj.h * p.scale;
      ctx.fillStyle = obj.col; ctx.fillRect(p.sx - w / 2, p.sy - h, w, h);
      ctx.strokeStyle = obj.win; ctx.lineWidth = 2; ctx.strokeRect(p.sx - w / 2, p.sy - h, w, h);
    } else if (type === 'v') {
      const p = project(obj.x, 0, obj.z); if (!p) return;
      const w = (obj.type === 'tank' ? 3.8 : 2.6) * p.scale, h = (obj.type === 'tank' ? 2.1 : 1.4) * p.scale;
      ctx.fillStyle = obj.col; ctx.fillRect(p.sx - w / 2, p.sy - h, w, h);
      if (obj.type === 'tank') { ctx.fillStyle = '#1f3317'; ctx.fillRect(p.sx - w * 0.3, p.sy - h * 1.35, w * 0.6, h * 0.4); }
    } else if (type === 'bot' || type === 'peer') {
      const p = project(obj.x, obj.y || 0, obj.z); if (!p) return;
      const fallen = (obj.fallen > 0 || obj.dead > 0);
      const w = (fallen ? 1.8 : 0.85) * p.scale, h = (fallen ? 0.5 : 1.9) * p.scale;
      ctx.fillStyle = obj.col || '#ff0055'; ctx.fillRect(p.sx - w / 2, p.sy - h, w, h);
      if (!fallen) { ctx.fillStyle = '#ffdbac'; ctx.fillRect(p.sx - w * 0.28, p.sy - h * 1.25, w * 0.56, h * 0.25); }
      if (obj.loot) { ctx.fillStyle = '#ffd700'; ctx.fillRect(p.sx - w * 0.35, p.sy - h * 0.8, w * 0.7, h * 0.4); }
    } else if (type === 'bul') {
      const p = project(obj.x, 1.3, obj.z); if (!p) return;       ctx.fillStyle = obj.tank ? '#ffa500' : '#00f2fe'; ctx.beginPath(); ctx.arc(p.sx, p.sy, (obj.tank ? 0.4 : 0.16) * p.scale, 0, 6.28); ctx.fill();
    } else if (type === 'part') {
      const p = project(obj.x, 1.2, obj.z); if (!p) return;
      ctx.fillStyle = `rgba(255,110,0,${obj.life / 20})`; ctx.beginPath(); ctx.arc(p.sx, p.sy, (22 - obj.life) * 0.35 * p.scale, 0, 6.28); ctx.fill();
    }
  });

  // Vue Arme / Poing Propulseur / Balayette FPS en bas de l'écran
  if (!inVeh && !isDead) {
    const pOff = Math.sin(animPunch * Math.PI) * 90;
    ctx.fillStyle = '#1e293b'; ctx.fillRect(W * 0.68, H - 140 - pOff, 45, 160);
    ctx.fillStyle = '#00f2fe'; ctx.fillRect(W * 0.67, H - 165 - pOff, 55, 35);
    if (animSweep > 0) {
      const sOff = Math.sin(animSweep * Math.PI) * 180;
      ctx.fillStyle = '#9b59b6'; ctx.fillRect(W * 0.25 + sOff * 0.5, H - 90 - sOff * 0.3, 180, 45);
    }
  } else if (inVeh && inVeh.type === 'tank') {
    ctx.fillStyle = '#2d4a22'; ctx.fillRect(W / 2 - 22, H - 140, 44, 140);
  }
}

function drawRadar() {
  const rCtx = document.getElementById('radar').getContext('2d'); rCtx.clearRect(0, 0, 100, 100);
  const plot = (wx, wz, col, r) => {
    const dx = (wx - player.x) * 0.4, dz = (wz - player.z) * 0.4;
    const rx = dx * Math.cos(-player.yaw) - dz * Math.sin(-player.yaw), rz = dx * Math.sin(-player.yaw) + dz * Math.cos(-player.yaw);
    if (Math.hypot(rx, rz) < 46) { rCtx.fillStyle = col; rCtx.beginPath(); rCtx.arc(50 + rx, 50 + rz, r, 0, 6.28); rCtx.fill(); }
  };
  plot(0, 13, '#ffd700', 4); plot(80, 80, '#00ff88', 4);
  vehicles.forEach(v => plot(v.x, v.z, v.type === 'tank' ? '#ffa500' : '#00f2fe', 3));
  bots.forEach(b => { if (b.dead <= 0) plot(b.x, b.z, '#ff0055', 2.5); });
  for (let id in peers) plot(peers[id].x, peers[id].z, '#ff00ff', 3.5);
  rCtx.fillStyle = '#fff'; rCtx.beginPath(); rCtx.arc(50, 50, 3, 0, 6.28); rCtx.fill();
}

function loop() {
  requestAnimationFrame(loop);
  if (fireCd > 0) fireCd--;
  if (animPunch > 0) animPunch = Math.max(0, animPunch - 0.08);
  if (animSweep > 0) animSweep = Math.max(0, animSweep - 0.06);

  if (!isDead) {
    if (inVeh) {
      inVeh.speed = (inVeh.speed + moveF * (inVeh.type === 'tank' ? 0.02 : 0.04)) * 0.94;
      inVeh.yaw -= moveR * 0.035 * Math.sign(inVeh.speed || 1);
      const nx = inVeh.x - Math.sin(inVeh.yaw) * inVeh.speed, nz = inVeh.z - Math.cos(inVeh.yaw) * inVeh.speed;
      if (!hitWall(nx, nz)) { inVeh.x = nx; inVeh.z = nz; } else inVeh.speed *= -0.4;
      player.x = inVeh.x; player.z = inVeh.z; player.yaw = inVeh.yaw;
    } else {
      document.getElementById('btn-veh').style.display = vehicles.some(v => !v.driver && Math.hypot(v.x - player.x, v.z - player.z) < 5.5) ? 'flex' : 'none';
      if (player.fallen > 0) player.fallen--;
      const spd = player.fallen > 0 ? 0.05 : 0.25;
      const dx = (-Math.sin(player.yaw) * moveF + Math.cos(player.yaw) * moveR) * spd + player.vx;
      const dz = (-Math.cos(player.yaw) * moveF - Math.sin(player.yaw) * moveR) * spd + player.vz;
      player.vx *= 0.88; player.vz *= 0.88;
      if (!hitWall(player.x + dx, player.z)) player.x += dx;
      if (!hitWall(player.x, player.z + dz)) player.z += dz;
      player.y = Math.max(0, player.y + player.vy); if (player.y > 0) player.vy -= 0.02; else player.vy = 0;
    }

    checkpoints.forEach(cp => { if (Math.hypot(player.x - cp.x, player.z - cp.z) < 3.2 && (spawnPt.x !== cp.x || spawnPt.z !== cp.z)) { spawnPt = { x: cp.x, z: cp.z }; playSfx('cash'); document.getElementById('q-desc').innerText = '🔵 Point de réapparition sauvegardé !'; } });
    if (!hasLoot && Math.hypot(player.x, player.z - 13) < 3.8) { hasLoot = true; playSfx('cash'); document.getElementById('q-title').innerText = '💰 BUTIN VOLÉ !'; document.getElementById('q-desc').innerText = 'File au cercle VERT (Nord-Est)'; }
    else if (hasLoot && Math.hypot(player.x - 80, player.z - 80) < 5.8) { hasLoot = false; addReward(5000, 60); document.getElementById('q-title').innerText = '✅ BRAQUAGE +5000$'; document.getElementById('q-desc').innerText = 'Retourne braquer ou ouvre la Boutique'; }
  }

  bots.forEach(b => {
    if (b.dead > 0) { if (--b.dead === 0) { b.hp = 100; b.x = (Math.random() - 0.5) * 90; b.z = (Math.random() - 0.5) * 90; } return; }
    b.x += b.vx; b.z += b.vz; b.y = Math.max(0, b.y + b.vy); b.vx *= 0.88; b.vz *= 0.88; if (b.y > 0) b.vy -= 0.02; else b.vy = 0;
    if (b.fallen > 0) { b.fallen--; return; }
    const dist = Math.hypot(player.x - b.x, player.z - b.z);
    if (dist < 32 && !isDead) {
      const ang = Math.atan2(player.x - b.x, player.z - b.z);
      if (dist > 6 && !hitWall(b.x + Math.sin(ang) * 0.09, b.z + Math.cos(ang) * 0.09)) { b.x += Math.sin(ang) * 0.09; b.z += Math.cos(ang) * 0.09; }
      if (--b.cd <= 0) { b.cd = 90; bullets.push({ x: b.x, z: b.z, vx: Math.sin(ang) * 1.4, vz: Math.cos(ang) * 1.4, mine: false, tank: false, life: 60 }); }
    }
    if (b.hp <= 0) { b.dead = 180; addReward(600, 25); }
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx; b.z += b.vz; b.life--;
    if (b.mine) {
      bots.forEach(bot => { if (bot.dead <= 0 && Math.hypot(b.x - bot.x, b.z - bot.z) < 1.5) { bot.hp -= b.tank ? 120 : 35; b.life = 0; } });
      for (let id in peers) if (Math.hypot(b.x - peers[id].x, b.z - peers[id].z) < 1.6) { if (window.sendNet) window.sendNet({ type: 'hit', kind: 'bullet', target: id, tank: b.tank }); b.life = 0; }
    } else if (Math.hypot(b.x - player.x, b.z - player.z) < 1.3) { takeDamage(8); b.life = 0; }
    if (b.life <= 0 || hitWall(b.x, b.z)) { if (b.tank) { playSfx('boom'); particles.push({ x: b.x, z: b.z, life: 20 }); bots.forEach(bot => { if (Math.hypot(bot.x - b.x, bot.z - b.z) < 8) { bot.hp -= 100; bot.vy = 0.6; } }); } bullets.splice(i, 1); }
  }
  for (let i = particles.length - 1; i >= 0; i--) if (--particles[i].life <= 0) particles.splice(i, 1);
  for (let id in peers) if (--peers[id].ttl <= 0) delete peers[id];

  render3D(); drawRadar();
}

function startGame(m) {
  if (running) return; running = true; mode = m;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  initWorld(); setupInputs(); initOnline(); loop();
}
</script>
